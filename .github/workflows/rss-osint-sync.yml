name: OSINT RSS Auto-Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-briefings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync RSS feeds to Markdown briefings
        env:
          EXTRA_RSS_FEEDS: ${{ vars.EXTRA_RSS_FEEDS }}
        run: python3 scripts/sync_rss_briefs.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings/ README.md
          if git diff --staged --quiet; then
            echo "No new dispatches to commit."
          else
            git commit -m "chore(osint): sync latest telemetry briefings"
            git push
          fi
